# Local backend infra for GrabCode. Host ports avoid the defaults (5432/4222) to not clash with other projects.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: grabcode
      POSTGRES_PASSWORD: grabcode
      POSTGRES_DB: grabcode
    ports: ['127.0.0.1:5433:5432']
    volumes: ['pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U grabcode']
      interval: 2s
      retries: 20

  nats:
    image: nats:2.10-alpine
    command: ['-js', '-sd', '/data', '-m', '8222']
    ports: ['127.0.0.1:4223:4222', '127.0.0.1:8223:8222']
    volumes: ['natsdata:/data']

volumes:
  pgdata:
  natsdata:
