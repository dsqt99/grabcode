# Local backend infra for GrabCode. Host ports avoid the defaults (5432/4222) to not clash with other projects.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: grabcode
      POSTGRES_PASSWORD: grabcode
      POSTGRES_DB: grabcode
    ports: ['127.0.0.1:5433:5432']
    volumes: ['pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U grabcode']
      interval: 2s
      retries: 20

  nats:
    image: nats:2.10-alpine
    command: ['-js', '-sd', '/data', '-m', '8222']
    ports: ['127.0.0.1:4223:4222', '127.0.0.1:8223:8222']
    volumes: ['natsdata:/data']

  # S6 realtime: reads hints from public.centrifugo_outbox (written by core-api triggers), pushes them over WebSocket.
  # Token secret comes from .env (CENTRIFUGO_CLIENT_TOKEN_HMAC_SECRET_KEY, shared with core-api); never commit it.
  centrifugo:
    image: centrifugo/centrifugo:v6
    command: ['centrifugo', '-c', '/centrifugo/config.json']
    environment:
      CENTRIFUGO_CLIENT_TOKEN_HMAC_SECRET_KEY: ${CENTRIFUGO_CLIENT_TOKEN_HMAC_SECRET_KEY:-}
    volumes: ['./infra/centrifugo.json:/centrifugo/config.json:ro']
    ports: ['127.0.0.1:8000:8000']
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  natsdata:
