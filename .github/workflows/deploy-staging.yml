name: deploy-staging

# Deploys the staging demo (docs/STAGING.md) to the VPS over SSH.
# MANUAL ONLY: Actions -> deploy-staging -> Run workflow (pick the branch, or type a branch/tag/SHA in `ref`).
# There is deliberately no push trigger: on the shared VPS every build takes ~3 GB RAM next to production.
# Source is pushed from the runner (`git archive | ssh tar -x`); the VPS needs no git, no clone, no deploy key.
# Without the secrets below the run succeeds with a notice and does nothing.
#
# Secrets (Settings -> Secrets and variables -> Actions). None of them live in the repo:
#   STAGING_SSH_HOST    VPS IP or host name
#   STAGING_SSH_USER    login user (member of the docker group)
#   STAGING_SSH_KEY     private key (PEM / OpenSSH) allowed to log in as that user
#   STAGING_DOMAIN      domain of the staging site, e.g. staging.example.com (no https://)
# Optional secrets:
#   STAGING_SSH_PORT         default 22
#   STAGING_SSH_KNOWN_HOSTS  output of `ssh-keyscan -H <host>` taken from a trusted machine; without it the host key
#                            is fetched during the run (trust on first use)
#   STAGING_APP_DIR          source folder on the VPS, default ~/grabcode-staging (keep it fixed: staging-up.sh compares the
#                            working_dir of the grabcode-staging project). .env.staging and data inside it are kept.
#   STAGING_HTTP_PORT        SHARED-VPS mode (production already on that VPS): Caddy runs plain HTTP on 127.0.0.1:<port>, no 80/443,
#                            and your own reverse proxy maps the domain to it. The final check then curls that port over SSH
#                            instead of https://<domain> (which may not be mapped yet). Unset = standalone staging on 80/443.
#   STAGING_BIND_PUBLIC      "true" binds 0.0.0.0 instead of 127.0.0.1 (shared mode only; firewall the port)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to deploy (empty = the branch selected above)
        required: false
        default: ''

# One deploy at a time; a newer run waits instead of killing a running deploy halfway through a build.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Check staging secrets
        id: cfg
        env:
          HOST: ${{ secrets.STAGING_SSH_HOST }}
          USER_NAME: ${{ secrets.STAGING_SSH_USER }}
          KEY: ${{ secrets.STAGING_SSH_KEY }}
          DOMAIN: ${{ secrets.STAGING_DOMAIN }}
          HTTP_PORT: ${{ secrets.STAGING_HTTP_PORT }}
        run: |
          [ -z "$HTTP_PORT" ] || echo "shared=true" >> "$GITHUB_OUTPUT"
          missing=""
          [ -n "$HOST" ] || missing="$missing STAGING_SSH_HOST"
          [ -n "$USER_NAME" ] || missing="$missing STAGING_SSH_USER"
          [ -n "$KEY" ] || missing="$missing STAGING_SSH_KEY"
          [ -n "$DOMAIN" ] || missing="$missing STAGING_DOMAIN"
          if [ -n "$missing" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Staging deploy skipped::Missing secrets:$missing. Set them (docs/STAGING.md) to enable this workflow."
            echo "Staging deploy skipped. Missing secrets:$missing" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy over SSH
        if: steps.cfg.outputs.configured == 'true'
        env:
          HOST: ${{ secrets.STAGING_SSH_HOST }}
          USER_NAME: ${{ secrets.STAGING_SSH_USER }}
          KEY: ${{ secrets.STAGING_SSH_KEY }}
          PORT: ${{ secrets.STAGING_SSH_PORT }}
          KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
          DOMAIN: ${{ secrets.STAGING_DOMAIN }}
          APP_DIR: ${{ secrets.STAGING_APP_DIR }}
          HTTP_PORT: ${{ secrets.STAGING_HTTP_PORT }}
          BIND_PUBLIC: ${{ secrets.STAGING_BIND_PUBLIC }}
        run: |
          set -euo pipefail
          umask 077
          # Secrets pasted into the GitHub UI often carry a trailing space or newline; drop all whitespace.
          for v in HOST USER_NAME PORT DOMAIN APP_DIR HTTP_PORT BIND_PUBLIC; do
            printf -v "$v" '%s' "$(printf '%s' "${!v}" | tr -d '[:space:]')"
          done
          for v in PORT HTTP_PORT; do
            case "${!v}" in *[!0-9]*) echo "::error::The $v secret must be digits only (e.g. 18080); it contains other characters such as a host, a colon or a quote. Re-enter just the number."; exit 1;; esac
          done
          SHA="$(git rev-parse HEAD)"
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/staging_key
          if [ -n "$KNOWN_HOSTS" ]; then printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          else ssh-keyscan -H -p "${PORT:-22}" "$HOST" > ~/.ssh/known_hosts 2>/dev/null; fi
          ssh_opts=(-i ~/.ssh/staging_key -p "${PORT:-22}" -o BatchMode=yes -o StrictHostKeyChecking=yes)
          dir="${APP_DIR:-grabcode-staging}"; dir="${dir#\~/}"   # relative paths resolve from the login user's $HOME
          qdir="$(printf '%q' "$dir")"
          # Push the exact commit as a tarball. No rm: .env.staging and data already in the folder stay.
          git archive "$SHA" | ssh "${ssh_opts[@]}" "$USER_NAME@$HOST" "mkdir -p $qdir && tar -x -C $qdir"
          ssh "${ssh_opts[@]}" "$USER_NAME@$HOST" bash -s -- "$SHA" "$DOMAIN" "$dir" "${HTTP_PORT:-}" "${BIND_PUBLIC:-}" <<'REMOTE'
          set -euo pipefail
          sha="$1"; domain="$2"; dir="$3"; port="${4:-}"; public="${5:-}"
          cd "$dir"
          args=()
          [ -z "$port" ] || args+=(--port "$port")
          [ "$public" != "true" ] || args+=(--public)
          # Every rebuild leaves the previous grabcode-staging-* images untagged (several GB each; run #20 hit
          # "no space left on device"). Remove only those once untagged and unused; production images are never touched.
          old_images="$(docker images -q --filter 'reference=grabcode-staging-*' | sort -u | tr '\n' ' ')"
          prune_old() {
            docker image prune -f --filter label=com.docker.compose.project=grabcode-staging >/dev/null 2>&1 || true
            for id in $old_images; do
              [ "$(docker image inspect -f '{{len .RepoTags}}' "$id" 2>/dev/null || echo 1)" = 0 ] && docker image rm "$id" >/dev/null 2>&1 || true
            done
          }
          prune_old
          root="$(docker info -f '{{.DockerRootDir}}' 2>/dev/null || echo /var/lib/docker)"
          avail_kb="$(df -Pk "$root" 2>/dev/null | awk 'NR==2{print $4}' || true)"
          if [ -n "$avail_kb" ] && [ "$avail_kb" -lt $((5 * 1024 * 1024)) ]; then
            docker system df || true
            echo "::error::Only $((avail_kb / 1024 / 1024)) GB free on the VPS disk holding $root; the build needs ~5 GB. Free space (e.g. 'docker builder prune -f': build cache only, no container, image in use or volume is removed), then run again."
            exit 1
          fi
          # </dev/null: this script arrives on stdin; docker compose inside staging-up would read the rest of it.
          ./infra/deploy/staging-up.sh ${args[@]+"${args[@]}"} "$domain" </dev/null
          prune_old
          if [ -n "$port" ]; then
            ok=0
            for _ in $(seq 1 20); do
              if curl -fsS --max-time 10 "http://127.0.0.1:$port/v1/auth/providers" >/dev/null; then ok=1; break; fi
              sleep 6
            done
            [ "$ok" = 1 ] || { echo "::error::http://127.0.0.1:$port/v1/auth/providers did not answer on the VPS"; exit 1; }
            echo "Staging answers on 127.0.0.1:$port of the VPS (map your domain to it)."
          fi
          REMOTE
          rm -f ~/.ssh/staging_key

      - name: Check the site answers
        if: steps.cfg.outputs.configured == 'true' && steps.cfg.outputs.shared != 'true'
        env:
          DOMAIN: ${{ secrets.STAGING_DOMAIN }}
        run: |
          for i in $(seq 1 20); do
            if curl -fsS --max-time 10 "https://$DOMAIN/v1/auth/providers" >/dev/null; then
              echo "Staging is up: https://$DOMAIN" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 6
          done
          echo "::error::https://$DOMAIN/v1/auth/providers did not answer after the deploy"
          exit 1
