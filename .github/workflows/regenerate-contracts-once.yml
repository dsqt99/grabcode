name: regenerate-contracts-once
on:
  push:
    branches: [chore/contracts-regenerate]
    paths: [.github/workflows/regenerate-contracts-once.yml]

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm generate
      - run: git rm -q .github/workflows/regenerate-contracts-once.yml
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/contracts
          git commit -m 'chore(contracts): regenerate OpenAPI and event schemas after HON-8' -m 'main CI was red on the contract drift step: deliveryUrl, admin confirm-payment and view=attention were in zod but not in the committed artifacts. Output of pnpm generate, no hand edits.'
          git push origin HEAD:chore/contracts-regenerate
